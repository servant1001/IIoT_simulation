services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iiot_fault_lab}
      POSTGRES_USER: ${POSTGRES_USER:-iiot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  seq:
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD:?Set SEQ_FIRSTRUN_ADMINPASSWORD in .env}
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:5341:5341"
    volumes:
      - seq-data:/data
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  ml-lab:
    build:
      context: ./ml
    profiles: ["ml"]
    working_dir: /workspace
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/workspace
volumes:
  postgres-data:
  seq-data:
