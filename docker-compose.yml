services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iiot_fault_lab}
      POSTGRES_USER: ${POSTGRES_USER:-iiot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  seq:
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD:?Set SEQ_FIRSTRUN_ADMINPASSWORD in .env}
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:5341:5341"
    volumes:
      - seq-data:/data
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  mosquitto-auth-simulator:
    image: eclipse-mosquitto:2
    profiles: ["fault-simulators"]
    environment:
      MQTT_AUTH_USERNAME: ${MQTT_AUTH_USERNAME:-iiot-lab}
      MQTT_AUTH_PASSWORD: ${MQTT_AUTH_PASSWORD:-iiot-lab-password}
    command:
      - /bin/sh
      - -c
      - |
        mosquitto_passwd -b -c /tmp/passwordfile "$$MQTT_AUTH_USERNAME" "$$MQTT_AUTH_PASSWORD";
        chown mosquitto:mosquitto /tmp/passwordfile;
        chmod 700 /tmp/passwordfile;
        exec mosquitto -c /mosquitto/config/mosquitto-auth.conf;
    ports:
      - "127.0.0.1:1884:1884"
    volumes:
      - ./mosquitto/config/mosquitto-auth.conf:/mosquitto/config/mosquitto-auth.conf:ro
  mqtt-topic-reject-simulator:
    build:
      context: ./modbus-simulator
    profiles: ["fault-simulators"]
    command: ["python", "mqtt_topic_reject_server.py"]
    ports:
      - "127.0.0.1:1885:1885"
  mqtt-json-publisher:
    image: eclipse-mosquitto:2
    profiles: ["mqtt-simulators"]
    depends_on:
      - mosquitto
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          mosquitto_pub -h mosquitto -t factory/machine01/data -q 1 -m '{"temperature":25.0,"pressure":101.3,"rpm":1500}';
          sleep 0.5;
        done
  mqtt-invalid-payload-publisher:
    image: eclipse-mosquitto:2
    profiles: ["mqtt-simulators"]
    depends_on:
      - mosquitto
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          mosquitto_pub -h mosquitto -t factory/machine01/data -q 1 -m 'not-json-payload';
          sleep 0.5;
        done
  modbus-simulator:
    build:
      context: ./modbus-simulator
    ports:
      - "127.0.0.1:1502:502"
  modbus-timeout-simulator:
    build:
      context: ./modbus-simulator
    command: ["python", "timeout_server.py"]
    profiles: ["fault-simulators"]
    ports:
      - "127.0.0.1:1503:502"
  modbus-illegal-address-simulator:
    build:
      context: ./modbus-simulator
    command: ["python", "illegal_address_server.py"]
    profiles: ["fault-simulators"]
    ports:
      - "127.0.0.1:1504:502"
  modbus-unknown-exception-simulator:
    build:
      context: ./modbus-simulator
    command: ["python", "unknown_exception_server.py"]
    profiles: ["fault-simulators"]
    ports:
      - "127.0.0.1:1506:502"
  modbus-connection-reset-simulator:
    build:
      context: ./modbus-simulator
    command: ["python", "connection_reset_server.py"]
    profiles: ["fault-simulators"]
    ports:
      - "127.0.0.1:1507:502"
  modbus-delay-simulator:
    build:
      context: ./modbus-simulator
    command: ["python", "modbus_delay_proxy.py"]
    profiles: ["fault-simulators"]
    environment:
      MODBUS_DELAY_SEQUENCE_MS: "${MODBUS_DELAY_SEQUENCE_MS:-150,300,450,600,750}"
    depends_on:
      - modbus-simulator
    ports:
      - "127.0.0.1:1505:502"
  opcua-timeout-simulator:
    build:
      context: ./modbus-simulator
    command: ["python", "opcua_timeout_server.py"]
    profiles: ["fault-simulators"]
    ports:
      - "127.0.0.1:53531:53531"
  opcua-session-disconnect-proxy:
    build:
      context: ./modbus-simulator
    profiles: ["fault-simulators"]
    command: ["python", "opcua_session_disconnect_proxy.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:53532:53532"
  ml-lab:
    build:
      context: ./ml
    profiles: ["ml"]
    working_dir: /workspace
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/workspace
volumes:
  postgres-data:
  seq-data:
